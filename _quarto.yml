project:
  type: website
  output-dir: _site
  pre-render: scripts/substack.lua   # pulls new Substack posts into shelf/substack.yml
  post-render: scripts/feed.lua      # writes the RSS feed, index.xml
  resources:
    - "shelf/**/*.xlsx"
    - "shelf/**/*.csv"
    - "shelf/**/*.ipynb"
    - "!shelf/_template/**"

website:
  title: "Lawrence Agyepong"
  description: "Analysis, data tools and research from an economist who likes to show the working."
  site-url: https://agyeponglawrence.com
  favicon: images/favicon.png
  image: images/lawrence.jpg   # link preview for any page without its own image
  open-graph: true
  twitter-card:
    card-style: summary   # small square card; suits the headshot
  navbar:
    left:
      # Notebooks (notebooks.qmd) joins the bar once the first one is in shelf/
      - href: analysis.qmd
        text: Analysis
      - href: tools/index.qmd
        text: Tools
      - href: research.qmd
        text: Research
      - href: about.qmd
        text: About
    right:
      - text: Subscribe
        href: https://ajaypong.substack.com
      - icon: linkedin
        href: https://www.linkedin.com/in/agyeponglawrence
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/agyeponglawrence
        aria-label: GitHub
  page-footer:
    left: "© 2026 Lawrence Agyepong · Views are my own, not my employer's · Built with [Quarto](https://quarto.org)"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/agyeponglawrence
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:agyeponglawrence101@gmail.com
        aria-label: Email
      - icon: github
        href: https://github.com/agyeponglawrence
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS feed

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [cosmo, styles.scss, styles-dark.scss]
    respect-user-color-scheme: true
    toc: false
    code-fold: true
    code-summary: "Show code"
    code-tools: false
    highlight-style: github
    include-in-header:
      - text: '<link rel="alternate" type="application/rss+xml" title="Lawrence Agyepong" href="/index.xml">'
    include-before-body:
      - _includes/skip.html
    include-after-body:
      - _includes/analytics.html
      - _includes/site.html

execute:
  freeze: auto
