project:
  type: website
  output-dir: _site

website:
  title: "Lawrence Agyepong"
  description: "Open research notebooks on the Canadian economy. Every chart comes with the Python notebook and an Excel workbook so you can rebuild it."
  site-url: https://agyeponglawrence.com
  favicon: images/favicon.png
  open-graph: true
  navbar:
    left:
      - href: notebooks/index.qmd
        text: Notebooks
      - href: writing.qmd
        text: Writing
      - href: about.qmd
        text: About
    right:
      - text: Subscribe
        href: https://ajaypong.substack.com
      - icon: linkedin
        href: https://www.linkedin.com/in/agyeponglawrence
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/agyeponglawrence
        aria-label: GitHub
  page-footer:
    left: "© 2026 Lawrence Agyepong. Views are my own."
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: false
    include-after-body: analytics.html
