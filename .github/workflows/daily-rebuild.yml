# Rebuilds the site on Vercel once a day so new Substack posts show up without a push.
# Needs a Vercel deploy hook saved as the repository secret VERCEL_DEPLOY_HOOK (see README).
name: Daily rebuild

on:
  schedule:
    - cron: "47 11 * * *"   # 11:47 UTC, about 5:47 am in Saskatchewan
  workflow_dispatch:         # "Run workflow" button for a rebuild on demand

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set, so there is nothing to trigger. See the README."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
