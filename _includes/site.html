<script>
// Site behaviour: hero chart that draws itself, tag-filter button states,
// and keeping the tag filter scoped to the shelf.
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const COLORS = ['var(--la-gold)', 'var(--la-slate)', 'var(--la-grey)', 'var(--la-ink2)'];

  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const step0 = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
    return ticks;
  }

  function drawHero(fig, text) {
    const rows = text.trim().split(/\r?\n/);
    const head = rows.shift().split(',').map((s) => s.trim());
    const iS = head.indexOf('series'), iX = head.indexOf('x'), iY = head.indexOf('y');
    if (iS < 0 || iX < 0 || iY < 0) return;
    const series = new Map();
    for (const r of rows) {
      const c = r.split(',');
      const name = c[iS].trim();
      if (!series.has(name)) series.set(name, []);
      series.get(name).push([+c[iX], +c[iY]]);
    }
    const pct = fig.dataset.format === 'percent';
    const fmt = (v) => (pct ? Math.round(v * 100) + '%' : (+v.toFixed(2)).toLocaleString());
    const all = [...series.values()].flat();
    const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
    const W = 560, H = 320, m = { l: 46, r: 110, t: 14, b: 44 };
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = Math.min(0, ...ys), y1 = Math.max(...ys);
    const sx = (v) => m.l + (v - x0) / ((x1 - x0) || 1) * (W - m.l - m.r);
    const sy = (v) => H - m.b - (v - y0) / ((y1 - y0) || 1) * (H - m.t - m.b);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
    for (const t of niceTicks(y0, y1, 4)) {
      el('line', { x1: m.l, x2: W - m.r, y1: sy(t), y2: sy(t), stroke: 'var(--la-line)' }, svg);
      el('text', { x: m.l - 8, y: sy(t) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--la-ink2)', 'font-family': 'IBM Plex Mono, monospace' }, svg).textContent = fmt(t);
    }
    for (const t of niceTicks(x0, x1, 4)) {
      el('text', { x: sx(t), y: H - m.b + 16, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--la-ink2)', 'font-family': 'IBM Plex Mono, monospace' }, svg).textContent = fmt(t);
    }
    if (fig.dataset.xlabel) el('text', { x: W - m.r, y: H - 6, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--la-ink2)', 'font-family': 'IBM Plex Mono, monospace' }, svg).textContent = fig.dataset.xlabel + ' →';
    if (fig.dataset.ylabel) el('text', { x: m.l, y: m.t - 2, 'font-size': 11, fill: 'var(--la-ink2)', 'font-family': 'IBM Plex Mono, monospace', 'dominant-baseline': 'hanging', dx: 6 }, svg).textContent = '↑ ' + fig.dataset.ylabel;
    // End labels, nudged apart so they never overlap.
    const ends = [];
    let i = 0;
    for (const [name, pts] of series) {
      pts.sort((a, b) => a[0] - b[0]);
      const color = COLORS[i % COLORS.length];
      const d = pts.map((p, k) => (k ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join(' ');
      el('path', { d, class: 'la-draw', style: `animation-delay:${i * 0.25}s`, pathLength: 1, fill: 'none', stroke: color, 'stroke-width': i === 0 ? 3.5 : 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
      const last = pts[pts.length - 1];
      el('circle', { cx: sx(last[0]), cy: sy(last[1]), r: i === 0 ? 5.5 : 4.5, fill: color, class: 'la-pop', style: 'animation-delay:1.5s' }, svg);
      ends.push({ name, color, x: sx(last[0]), y: sy(last[1]), bold: i === 0 });
      i++;
    }
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 16);
    for (const e of ends) {
      const t = el('text', { x: e.x + 10, y: e.y + 4, 'font-size': 13, fill: e.color, class: 'la-pop', style: 'animation-delay:1.5s', 'font-weight': e.bold ? 600 : 400 }, svg);
      t.textContent = e.name;
    }
    fig.querySelector('.la-hero-svg').appendChild(svg);
  }

  function syncTagButtons() {
    const bar = document.querySelector('.la-tags');
    if (!bar) return;
    const update = () => {
      const active = bar.querySelector('.category.active');
      bar.querySelectorAll('button').forEach((b) => {
        const on = active ? b === active : b.classList.contains('quarto-listing-category-title');
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };
    new MutationObserver(update).observe(bar, { subtree: true, attributes: true, attributeFilter: ['class'] });
    update();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[data-hero-src]').forEach((fig) => {
      fetch(fig.dataset.heroSrc).then((r) => (r.ok ? r.text() : Promise.reject())).then((t) => drawHero(fig, t)).catch(() => {});
    });
    syncTagButtons();
  });

  // Quarto applies a tag filter to every listing on the page; keep it to the shelf.
  window.addEventListener('load', () => {
    const lists = window['quarto-listings'] || {};
    for (const id of Object.keys(lists)) {
      if (id !== 'listing-shelf') {
        try { lists[id].filter(); } catch (e) {}
        delete lists[id];
      }
    }
  });
})();
</script>
<script>
// Sharing: the share bar under a piece's title, and a share row on every chart.
(function () {
  const pageUrl = () => location.href.split('#')[0];
  const pageTitle = () => (document.querySelector('.la-piece-head h1') || {}).textContent || document.title;
  const enc = encodeURIComponent;
  const targets = {
    linkedin: (url) => `https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}`,
    x: (url, text) => `https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(url)}`,
    bluesky: (url, text) => `https://bsky.app/intent/compose?text=${enc(text + ' ' + url)}`,
  };

  function copy(btn, text) {
    const done = () => { const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = old; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => window.prompt('Copy this link:', text));
    else window.prompt('Copy this link:', text);
  }

  function wire(group, url, text) {
    group.querySelectorAll('[data-share]').forEach((el) => {
      const kind = el.dataset.share;
      if (targets[kind]) el.href = targets[kind](url, text);
      if (kind === 'copy') el.addEventListener('click', () => copy(el, url));
    });
  }

  function chartRow(fig, n) {
    const id = 'chart-' + n;
    fig.id = fig.id || id;
    const url = pageUrl() + '#' + fig.id;
    const row = document.createElement('div');
    row.className = 'la-chart-share';
    row.setAttribute('role', 'group');
    row.setAttribute('aria-label', 'Share this chart');
    row.innerHTML = '<button type="button" data-act="png">Download PNG</button>' +
      '<button type="button" data-share="copy">Copy link</button>' +
      '<a data-share="linkedin" target="_blank" rel="noopener">LinkedIn</a>' +
      '<a data-share="x" target="_blank" rel="noopener">X</a>' +
      '<a data-share="bluesky" target="_blank" rel="noopener">Bluesky</a>';
    wire(row, url, pageTitle() + ' (chart ' + n + ')');
    const png = row.querySelector('[data-act="png"]');
    const plot = fig.querySelector('.js-plotly-plot');
    const img = fig.querySelector('img');
    const name = (location.pathname.split('/').filter(Boolean).slice(-2, -1)[0] || 'chart') + '-chart-' + n;
    if (plot) {
      png.addEventListener('click', () => {
        if (window.Plotly && window.Plotly.downloadImage) window.Plotly.downloadImage(plot, { format: 'png', width: 1200, height: 700, filename: name });
      });
    } else if (img) {
      png.addEventListener('click', () => { const a = document.createElement('a'); a.href = img.src; a.download = name + '.png'; a.click(); });
    } else {
      png.remove();
    }
    fig.appendChild(row);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const bar = document.querySelector('.la-piece-head .la-share');
    if (!bar) return;
    wire(bar, pageUrl(), pageTitle());
    let n = 0;
    document.querySelectorAll('#quarto-document-content .cell-output-display').forEach((fig) => {
      if (fig.querySelector('.js-plotly-plot, .plotly-graph-div, img')) chartRow(fig, ++n);
    });
    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) setTimeout(() => target.scrollIntoView({ block: 'start' }), 300);
    }
  });
})();
</script>
