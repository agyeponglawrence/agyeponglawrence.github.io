<header id="title-block-header" class="quarto-title-block la-piece-head">
<div class="la-kicker">$if(nb)$<span class="la-nb">$nb$</span>$endif$$if(type)$<span>$type$</span>$endif$$if(date)$<span>·</span><span>$date$</span>$endif$</div>
<h1 class="title">$title$</h1>
$if(subtitle)$<p class="la-piece-desc">$subtitle$</p>$else$$if(description)$<p class="la-piece-desc">$description$</p>$endif$$endif$
$if(note)$<p class="la-piece-note">$note$</p>$endif$
<div class="la-piece-meta">
$for(categories)$<a class="la-tag" href="/index.html#category=$categories$">#$categories$</a>$endfor$
</div>
<div class="la-share" role="group" aria-label="Share this piece">
<span class="la-share-label">Share</span>
<a data-share="linkedin" target="_blank" rel="noopener">LinkedIn</a>
<a data-share="x" target="_blank" rel="noopener">X</a>
<a data-share="bluesky" target="_blank" rel="noopener">Bluesky</a>
<button type="button" data-share="copy">Copy link</button>
</div>
</header>
